# MCP 서버 접속 정보 — 백엔드의 tool 은 전부 여기 적힌 서버에서 가져온다.
#
# ${VAR} 와 ${VAR:-기본값} 은 환경변수(.env)로 치환된다. 토큰은 yaml 에 직접 쓰지 말고 .env 에 둔다.
# 서버 하나가 죽어도 나머지 서버의 tool 은 정상 동작하고, 죽은 서버의 tool 은 "사용 불가" 로 표시된다.
# 같은 이름의 tool 이 여러 서버에 있으면 위에 적힌 서버가 이긴다(경고 로그).

servers:
  # 로컬 개발용 — mcp_server/fab_tools.py (회사에서는 enabled: false 로 끄거나 url 을 회사 주소로)
  fab:
    enabled: ${FAB_MCP_ENABLED:-true}
    transport: streamable_http
    url: ${FAB_MCP_URL:-http://localhost:8100/mcp}

  # ceeria tool 전체 (Lot/설비/재공/Hold/Part/지식베이스/검사·MCRS) — siria/adapters/mcp_server.py
  #   실행: cd siria && python -m adapters.mcp_server --http
  ceeria:
    enabled: ${CEERIA_MCP_ENABLED:-true}
    transport: streamable_http
    url: ${CEERIA_MCP_URL:-http://localhost:8200/mcp}

  # ── 회사 MCP 서버 예시 ── 주소/토큰만 채우고 enabled 를 true 로
  company_line:
    enabled: ${COMPANY_MCP_ENABLED:-false}
    transport: streamable_http
    url: ${COMPANY_LINE_MCP_URL:-https://mcp.fab.example.com/line/mcp}
    headers:
      Authorization: Bearer ${COMPANY_MCP_TOKEN:-}

  company_quality:
    enabled: ${COMPANY_MCP_ENABLED:-false}
    transport: streamable_http
    url: ${COMPANY_QUALITY_MCP_URL:-https://mcp.fab.example.com/quality/mcp}
    headers:
      Authorization: Bearer ${COMPANY_MCP_TOKEN:-}
